<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Library Book Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    font-size:15px;
}

.container{
    width:92%;
    max-width:1200px;
    margin:25px auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.stat-car
